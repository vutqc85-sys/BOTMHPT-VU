<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XZTW Bot Manager — Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark border-bottom border-secondary">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold">XZTW Bot Manager</span>
      <div class="d-flex align-items-center gap-2">
        <span id="navDisplayName" class="text-light"></span>
        <span id="navRoleBadge" class="badge"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="mb-0">Game Accounts</h3>
      <button id="addBtn" class="btn btn-primary d-none" onclick="openAddModal()">+ Thêm tài khoản game</button>
    </div>

    <div class="table-responsive">
      <table class="table table-dark table-striped table-hover">
        <thead>
          <tr>
            <th>Display Name</th>
            <th>Login</th>
            <th>Server</th>
            <th style="width: 230px;">Actions</th>
          </tr>
        </thead>
        <tbody id="accountsList"></tbody>
      </table>
    </div>
    <div id="noAccounts" class="text-center text-body-secondary py-5 d-none">No game accounts yet.</div>
  </div>

  <!-- Add/Edit modal -->
  <div class="modal fade" id="accountModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Thêm tài khoản game</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editId">
          <div class="mb-3">
            <label class="form-label" for="mDisplayName">Display Name</label>
            <input type="text" class="form-control" id="mDisplayName">
          </div>
          <div class="mb-3">
            <label class="form-label" for="mUsername">Login (username)</label>
            <input type="text" class="form-control" id="mUsername">
          </div>
          <div class="mb-3">
            <label class="form-label" for="mPassword">Password</label>
            <input type="password" class="form-control" id="mPassword" autocomplete="new-password">
          </div>
          <div class="mb-3">
            <label class="form-label" for="mServer">Server</label>
            <input type="text" class="form-control" id="mServer">
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="mVisible" checked>
            <label class="form-check-label" for="mVisible">Cho viewer thấy</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="saveAccount()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
