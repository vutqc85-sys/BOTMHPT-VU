<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XZTW Bot Manager — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-body-tertiary">
  <div class="container" style="max-width: 420px; margin-top: 12vh;">
    <h2 class="text-center mb-1">XZTW Bot Manager</h2>
    <p class="text-center text-body-secondary mb-4">Sign in to manage your game bots</p>

    <div class="card bg-dark border-secondary">
      <div class="card-body p-4">
        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" autocomplete="current-password" required>
          </div>
          <div id="loginError" class="alert alert-danger py-2 d-none" role="alert"></div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Already logged in? → dashboard
    fetch('/api/auth/me')
      .then(r => r.ok ? r.json() : null)
      .then(data => { if (data && data.user) window.location.href = '/dashboard'; })
      .catch(() => {});

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');
      errorEl.classList.add('d-none');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/dashboard';
        } else {
          errorEl.textContent = data.error || 'Login failed';
          errorEl.classList.remove('d-none');
        }
      } catch (err) {
        errorEl.textContent = 'Network error — please try again';
        errorEl.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
