<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XZTW Bot Manager — Account Config</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark border-bottom border-secondary mb-0">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold">XZTW Bot Manager</span>
      <div class="d-flex align-items-center gap-2">
        <span id="navDisplayName" class="text-light"></span>
        <span id="navRoleBadge" class="badge"></span>
        <a href="/dashboard" class="btn btn-outline-light btn-sm">← Back</a>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
      <h3 class="mb-0" id="pageTitle">Account Config</h3>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" onclick="saveAccount()">Save</button>
        <button class="btn btn-danger" onclick="deleteAndGo()">Delete</button>
      </div>
    </div>

    <!-- Phần 1: thông tin tài khoản game -->
    <div class="card bg-dark border-secondary mb-4">
      <div class="card-header fw-semibold">Thông tin tài khoản game</div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label" for="displayName">Display name</label>
            <input type="text" class="form-control" id="displayName">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label" for="username">Game login / username</label>
            <input type="text" class="form-control" id="username">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label" for="password">Game password</label>
            <input type="password" class="form-control" id="password" autocomplete="new-password" placeholder="Để trống nếu không đổi">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label" for="server">Server</label>
            <input type="text" class="form-control" id="server">
          </div>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="visibleToViewers">
          <label class="form-check-label" for="visibleToViewers">Cho viewer thấy tài khoản này</label>
        </div>
      </div>
    </div>

    <!-- Phần 2: cấu hình bot (2 cột, responsive) -->
    <h5 class="mb-3">Cấu hình bot</h5>
    <div id="settingsContainer"></div>

    <div class="d-flex gap-2 mb-5 mt-3">
      <button class="btn btn-primary" onclick="saveAccount()">Save</button>
      <button class="btn btn-danger" onclick="deleteAndGo()">Delete</button>
      <a href="/dashboard" class="btn btn-outline-secondary">← Back</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/settings-config.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
